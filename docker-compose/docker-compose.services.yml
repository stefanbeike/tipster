name: tipster

services:
  user-service:
    container_name: tipster-user-service
    build:
      context: ..
      dockerfile: backend/user-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://postgres:5432/tipsterdb
      DATASOURCES_DEFAULT_USERNAME: postgres
      DATASOURCES_DEFAULT_PASSWORD: dbpass
      JAVAMAIL_PROPERTIES_MAIL_SMTP_HOST: mailhog
      JAVAMAIL_PROPERTIES_MAIL_SMTP_PORT: 1025
      MAIL_FROM_EMAIL: noreply@tipster.local
      MAIL_FROM_NAME: Tipster
      APP_NAME: Tipster
      FRONTEND_BASE_URL: http://localhost:3000
      JWT_SECRET: local-dev-secret-key-please-change-me-1234567890
      INTERNAL_API_KEY: local-internal-secret-change-me
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: tipster
      MICRONAUT_ENVIRONMENTS: docker
    ports:
      - "8081:8081"
    networks:
      - tipster-network
    restart: unless-stopped

  payment-service:
    container_name: tipster-payment-service
    build:
      context: ..
      dockerfile: backend/payment-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATASOURCES_DEFAULT_URL: jdbc:postgresql://postgres:5432/tipsterdb
      DATASOURCES_DEFAULT_USERNAME: postgres
      DATASOURCES_DEFAULT_PASSWORD: dbpass
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: tipster
      MICRONAUT_ENVIRONMENTS: docker
    ports:
      - "8082:8082"
    networks:
      - tipster-network
    restart: unless-stopped

  frontend:
    container_name: tipster-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_USER_API_URL: http://localhost:8081
        VITE_PAYMENT_API_URL: http://localhost:8082
    depends_on:
      user-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - tipster-network
    restart: unless-stopped

networks:
  tipster-network:
    name: tipster-network
    external: true
