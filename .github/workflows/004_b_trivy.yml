name: Trivy Security Scan
'on':
  workflow_call:
    secrets: {}
jobs:
  trivy:
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivy-cache
    steps:
    - uses: actions/checkout@v4
    - name: Cache Trivy DB & cache
      uses: actions/cache@v4
      with:
        path: .trivy-cache
        key: trivy-${{ runner.os }}
        restore-keys: |
          trivy-${{ runner.os }}-
    - name: Trivy FS scan (vulns + secrets)
      uses: aquasecurity/trivy-action@v0.20.0
      with:
        scan-type: fs
        scan-ref: .
        security-checks: vuln,secret
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
        ignore-unfixed: true
    - name: Trivy config scan (misconfig)
      uses: aquasecurity/trivy-action@v0.20.0
      with:
        scan-type: config
        scan-ref: .
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
