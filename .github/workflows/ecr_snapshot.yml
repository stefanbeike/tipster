name: Manual Snapshot ECR Publish
'on':
  workflow_dispatch:
    inputs:
      service:
        description: Service to publish
        required: true
        type: choice
        options:
        - frontend
        - user-service
        - payment-service
      snapshot_tag:
        description: Snapshot tag
        required: true
        default: snapshot
jobs:
  publish:
    uses: ./.github/workflows/005_docker_build.yml
    with:
      service: ${{ github.event.inputs.service }}
      registry: ecr
      aws_region: ${{ vars.AWS_REGION || 'eu-north-1' }}
      aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      image_tag: ${{ github.event.inputs.snapshot_tag }}-${{ github.sha }}
      push_latest: false
    secrets: inherit
