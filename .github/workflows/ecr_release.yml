name: ECR Release Images
'on':
  push:
    tags:
    - v*
jobs:
  build-and-push-ecr:
    strategy:
      matrix:
        service:
        - frontend
        - user-service
        - payment-service
    uses: ./.github/workflows/005_docker_build.yml
    with:
      service: ${{ matrix.service }}
      registry: ecr
      aws_region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      push_latest: true
    secrets: inherit
