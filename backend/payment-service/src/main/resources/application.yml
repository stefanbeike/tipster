micronaut:
  application:
    name: payment-service
  server:
    port: 8082
  security:
    enabled: true
    authentication: bearer
    intercept-url-map:
      - pattern: /api/status
        access: isAnonymous()
      - pattern: /health/**
        access: isAnonymous()
      - pattern: /payment-service/tips/**
        access: isAnonymous()
      - pattern: /payment-service/webhooks/stripe
        access: isAnonymous()
      - pattern: /**
        access: isAuthenticated()
    token:
      jwt:
        signatures:
          secret:
            validation:
              secret: ${JWT_SECRET:local-dev-secret-key-please-change-me-1234567890}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/pay/success?session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/pay/cancelled}

endpoints:
  health:
    enabled: true
    sensitive: false

datasources:
  default:
    url: ${DATASOURCES_DEFAULT_URL:`jdbc:postgresql://localhost:5432/tipsterdb`}
    username: ${DATASOURCES_DEFAULT_USERNAME:postgres}
    password: ${DATASOURCES_DEFAULT_PASSWORD:dbpass}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    schema-generate: NONE
    schema: payment_mgmt

liquibase:
  enabled: true
  datasources:
    default:
      enabled: true
      liquibase-schema: payment_mgmt
      change-log: classpath:db/changelog/changelog-master.xml
      database-change-log-table-name: payment_mgmt_changelog
      database-change-log-lock-table-name: payment_mgmt_changelog_lock

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        default_schema: payment_mgmt
